plugins {
    id 'com.android.application'
}

android {
    namespace 'app.privatetodo'
    compileSdk 34

    defaultConfig {
        applicationId 'app.privatetodo'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Signed with the local debug key so the release APK installs directly.
            // Swap in your own keystore before publishing anywhere.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Zero third-party dependencies on purpose: nothing to phone home.
dependencies {
}
