plugins {
    id 'com.android.application'
}

android {
    namespace 'app.privatetodo'
    compileSdk 34

    defaultConfig {
        applicationId 'app.privatetodo'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // One fixed signing key kept in the repo (app/debug.keystore). Every build, wherever it is made,
    // is signed the same way, so a new APK installs over the old app and keeps all your data.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Signed with the local debug key so the release APK installs directly.
            // Swap in your own keystore before publishing anywhere.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Zero third-party dependencies on purpose: nothing to phone home.
dependencies {
}
